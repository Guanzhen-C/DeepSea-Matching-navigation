# Scoped addition to the workstation's existing Ethernet allowlist.
# Keep the current enp4s0 uplink, Wi-Fi, modem and fan-* handling unchanged.
[keyfile]
unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma,except:interface-name:enp4s0,except:interface-name:enx207bd2b013d1,interface-name:fan-*
